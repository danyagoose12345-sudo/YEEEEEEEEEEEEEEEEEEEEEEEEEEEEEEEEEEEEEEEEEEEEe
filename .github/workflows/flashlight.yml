name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git ffmpeg libgstreamer1.0-dev \
        gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
        gstreamer1.0-plugins-ugly gstreamer1.0-libav libgstrtspserver-1.0-dev libjpeg-dev \
        zlib1g-dev xclip xsel libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
        libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev libtiff5-dev libxpm-dev \
        libmtp-dev openjdk-17-jdk unzip zip tar curl wget libffi-dev libssl-dev autoconf libtool

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cython buildozer kivy plyer

    - name: Build APK with Buildozer
      run: |
        buildozer android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ColorFlashlight-APK
        path: bin/*.apk
