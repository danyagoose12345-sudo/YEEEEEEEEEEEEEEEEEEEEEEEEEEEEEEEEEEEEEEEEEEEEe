name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        # Ставим только базовые инструменты, остальное подтянет сам buildozer
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev
        python -m pip install --upgrade pip
        pip install cython buildozer kivy plyer

    - name: Build APK with Buildozer
      run: |
        # Команда 'buildozer android drivers' сама доставит все нужные пакеты без ошибок!
        buildozer android drivers
        buildozer android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ColorFlashlight-APK
        path: bin/*.apk

